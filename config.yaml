timezone: Europe/Amsterdam
years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
held_out_years: null             # null means every eligible year
resolution: auto                # auto, hourly, daily; no upsampling
minimum_coverage: 0.90
methods: [A1, NEDU, B, C]        # A* is added automatically when external_profile is set
                                 # backup (not used as results): A*b, A*b22, B+W
crisis_year: 2022                # only used by backup method A*b22
processed_dir: data/processed
results_dir: results             # outputs go into results/<carrier>/
weather:
  path:                          # KNMI hourly exports (uurgegevens), as downloaded (.txt or .zip)
    - data/raw/uurgeg_260_2011-2020.txt
    - data/raw/uurgeg_260_2021-2030.txt
    - data/raw/uurgeg_290_2011-2020.zip
    - data/raw/uurgeg_290_2021-2030.zip
    - data/raw/uurgeg_380_2011-2020.zip
    - data/raw/uurgeg_380_2021-2030.zip
    - data/raw/uurgeg_235_2011-2020.zip
    - data/raw/uurgeg_235_2021-2030.zip
    - data/raw/uurgeg_280_2011-2020.zip
    - data/raw/uurgeg_280_2021-2030.zip
    - data/raw/uurgeg_310_2011-2020.zip
    - data/raw/uurgeg_310_2021-2030.zip
  format: knmi                  # knmi or csv (timestamp_utc,temp_c,wind_ms,ghi_wm2)
  stations: nedu                 # NEDU TAC weights 260 .28, 290 .16, 380 .15, 235 .15, 280 .14, 310 .12;
                                 # renormalised over the stations present in each hour
carriers:
  electricity:
    demand:
      path: data/raw/electricity.csv
      format: csv               # csv, entsoe_csv, entsog_csv, entsoe_api
      # For entsoe_csv set timestamp_column, value_column and timezone.
      # entsoe_api uses ENTSOE_API_KEY and bidding_zone: NL.
    units: MW
    daily_start_hour: 0
    daily_label: timestamp       # date: demand dates name local window starts
    external_profile: null      # CSV path or mapping like carriers.heat.external_profile
  heat:
    demand:
      path: data/raw/ENAGAD.csv  # JRC ENaGaD daily gas demand, GWh/d per gas day
      format: enagad
      country: NL
      column: DIS                # distribution grid: residential + commercial
    units: GWh/d
    daily_start_hour: 6
    daily_label: date            # gas day D covers D 06:00 to D+1 06:00 local
    external_profile: null       # WPG (A*) dropped; see docs/results.md backup section
  gas_total:                     # all Dutch gas: TOT = DIS + OTHER (IND and GPP are 0 for NL)
    methods: [A1, B, C]          # no NEDU: NEDU profiles do not cover industry and power plants
    demand:
      path: data/raw/ENAGAD.csv
      format: enagad
      country: NL
      column: TOT
    units: GWh/d
    daily_start_hour: 6
    daily_label: date
    external_profile: null
nedu:                            # reference method NEDU: standard profiles, not fitted to demand
  path: data/raw/Profielen-*.zip
  weights: {G1A: 0.75, G2A: 0.25}  # annual-volume shares (NEDU annual reports 2016-2023);
                                   # GXX: add a weight once its volume is known (profiles 2020+ only)
  new_tac_from: 2016             # 2015 profiles use the old De Bilt rule T - W/1.5
cold_spells:
  - {name: "2018 freeze", start: "2018-02-24", end: "2018-03-04"}
  - {name: "2021 freeze", start: "2021-02-07", end: "2021-02-14"}
boosting:
  backend: sklearn              # sklearn (pinned, reproducible), lightgbm or auto
  max_iter: 500
  learning_rate: 0.05
  patience: 30
  threads: 2
  random_seed: 42
